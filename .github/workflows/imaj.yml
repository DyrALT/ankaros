# ankaros imajını (aarch64 ve x86_64, karar 0018) derler ve QEMU'da masaüstüne kadar açıldığını denetler.
#
# Derleme artımlıdır: Buildroot'un çıktısı önbellekte durur, yalnızca ankaros'un kendi paketleri
# (kabuk, compositor, sistem) yeniden derlenir. Buildroot, defconfig ya da external/ değişince önbellek
# geçersizleşir ve her şey baştan derlenir (ccache ile bile 50-60 dakika).
#
# main'de imajı etkileyen her değişiklikte çalışır. PR'larda yalnızca sistem katmanı değişince çalışır
# (Buildroot, external/, system/, derleme betikleri): kabuk ve compositor'ı CI iş akışı Qt 6.9'da derleyip
# denetler, imajdaki bozulmayı main'deki derleme yakalar. PR'lar bunu beklemez: imaj yerelde derlenip
# denenir (docs/gelistirme-ortami.md). Elle başlatmak için: gh workflow run imaj.yml --ref <dal>
# x86_64 PR'larda çalışmaz: main'de ve elle başlatılınca derlenir, süreyi iki katına çıkarmasın.
#
# vX.Y.Z etiketi gönderilince iki imaj da derlenir, açılış testini geçerse GitHub Release'e eklenir
# (CONTRIBUTING.md → Sürümler). Etikette dosya filtresi uygulanmaz, her zaman çalışır.
name: İmaj

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - buildroot
      - .gitmodules
      - VERSION
      - external/**
      - shell/**
      - compositor/**
      - system/**
      - scripts/build.sh
      - scripts/qemu-test.py
      - .github/workflows/imaj.yml
  pull_request:
    paths:
      - buildroot
      - .gitmodules
      - VERSION
      - external/**
      - system/**
      - scripts/build.sh
      - scripts/qemu-test.py
      - .github/workflows/imaj.yml
  workflow_dispatch:

# PR'da yeni push eskisini iptal eder. main'de iptal edilmez: çalışan derleme biter, en son push sıraya
# girer (aradaki push'lar atlanır). Yoksa sık birleştirmede main'deki derleme hiç tamamlanmaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: İmaj (${{ matrix.arch }})
    # Her mimari kendi işlemcisinde derlenir: Buildroot kendi araç zincirini yerel olarak derler.
    # Bir mimari kırılsa da diğeri bitsin, hangisinin bozulduğu görünsün.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"aarch64","runner":"ubuntu-24.04-arm","qemu":"qemu-system-arm","kernel":"Image"}]' || '[{"arch":"aarch64","runner":"ubuntu-24.04-arm","qemu":"qemu-system-arm","kernel":"Image"},{"arch":"x86_64","runner":"ubuntu-24.04","qemu":"qemu-system-x86","kernel":"bzImage"}]') }}
    runs-on: ${{ matrix.runner }}
    # Önbelleksiz ilk derleme Qt 6 ve Mesa ile birlikte birkaç saat sürer.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget cpio unzip rsync bc python3 libncurses-dev
      - name: Önbellek anahtarı
        # Çıktının geçerli olduğu durum: Buildroot'un commit'i, external/ (defconfig, paket tarifleri,
        # kart dosyaları) ve derleme betiği. Biri değişince çıktı önbelleği kullanılmaz.
        id: anahtar
        run: |
          echo "cikti=buildroot-cikti-v1-${{ matrix.arch }}-$(git rev-parse HEAD:buildroot)-${{ hashFiles('external/**', 'scripts/build.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Önbellek (Buildroot çıktısı)
        # Yalnızca birebir aynı anahtar: eski bir çıktının üstüne derlemek bayat paketler bırakabilir
        id: cikti
        uses: actions/cache/restore@v4
        with:
          path: ~/ankaros-output
          key: ${{ steps.anahtar.outputs.cikti }}
      - name: Önbellek (kaynak paketleri ve ccache)
        # Yalnızca baştan derlerken gerekir
        if: steps.cikti.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/ankaros-dl
            ~/.buildroot-ccache
          # Mimariler kendi önbelleğini kullanır. Son satır yalnızca bir mimarinin hiç önbelleği yokken işe
          # yarar: kaynak paketlerini kurtarır, öteki mimarinin ccache kayıtları kullanılmaz ve zamanla silinir.
          key: buildroot-${{ matrix.arch }}-${{ hashFiles(format('external/configs/ankaros_qemu_{0}_defconfig', matrix.arch), '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            buildroot-${{ matrix.arch }}-${{ hashFiles(format('external/configs/ankaros_qemu_{0}_defconfig', matrix.arch), '.gitmodules') }}-
            buildroot-${{ matrix.arch }}-
            buildroot-
      - name: Derle
        # Önbellekten gelen çıktıda Buildroot dosya tarihlerine bakar: checkout'taki dosyalar (defconfig,
        # çekirdek yapılandırması) damgalardan yeni görünür, çekirdek baştan yapılandırılmaya kalkar. Girdiler
        # anahtarda olduğundan damgalar ve .config tek bir ana tarihlenir (aynı tarih: birbirlerini de
        # tetiklemesinler).
        run: |
          if [ "${{ steps.cikti.outputs.cache-hit }}" = true ]; then
            t="@$(date +%s)"
            find ~/ankaros-output/build -mindepth 2 -maxdepth 2 -name '.stamp_*' -exec touch -d "$t" {} +
            touch -d "$t" ~/ankaros-output/.config
          fi
          ./scripts/build.sh
      - name: Açılış testi (QEMU)
        # İmaj ekransız açılır, masaüstü görünene kadar ekran görüntüsü alınır. arm64 makinede KVM yok,
        # işlemci yazılımla taklit edilir: Mac'te 20 saniye süren açılış burada birkaç dakika sürebilir.
        # x86_64 makinede KVM var, kullanıcıya açılınca qemu-test.py kendisi seçer.
        # Açılış süresi raporu (ankarosctl boot) iş akışının özet sayfasına da yazılır, docs/acilis-suresi.md
        run: |
          set -o pipefail
          sudo apt-get install -y ${{ matrix.qemu }}
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ./scripts/qemu-test.py --boot-timeout 600 --expect-desktop --wait 900 \
            --screenshot acilis-testi.png --log acilis-testi.log | tee acilis-testi.txt
          {
            echo "### Açılış süresi (QEMU, ${{ matrix.arch }})"
            echo '```text'
            sed -n '/^ADIM/,/^Toplam/p' acilis-testi.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Açılış testinin ekran görüntüsü ve günlüğü
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acilis-testi-${{ matrix.arch }}
          path: |
            acilis-testi.png
            acilis-testi.log
            acilis-testi.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ankaros-qemu-${{ matrix.arch }}
          path: |
            ~/ankaros-output/images/${{ matrix.kernel }}
            ~/ankaros-output/images/rootfs.ext4
          retention-days: 14
      - name: Önbellek (kaynak paketleri ve ccache) kaydet
        if: steps.cikti.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/ankaros-dl
            ~/.buildroot-ccache
          key: buildroot-${{ matrix.arch }}-${{ hashFiles(format('external/configs/ankaros_qemu_{0}_defconfig', matrix.arch), '.gitmodules') }}-${{ github.sha }}
      - name: Buildroot çıktısını önbellek için küçült
        # build/ 20 GB'ı aşar. Buildroot bir paketin bittiğini build/<paket>/.stamp_* dosyalarından anlar,
        # derlenmiş hali host/ (araç zinciri ve sysroot) ve target/ altındadır. Damgalar dışında build/
        # silinir, ankaros paketlerinin dizini tümden: bir sonraki koşuda yalnızca onlar baştan derlenir.
        # Kök dosya sistemi her derlemede yeniden oluşur, saklanmaz. Kalan ~1,5 GB (yerelde denendi: ankaros
        # paketleri dışında hiçbir şey yeniden derlenmedi).
        if: steps.cikti.outputs.cache-hit != 'true'
        run: |
          cd ~/ankaros-output
          rm -rf build/ankaros-* images/rootfs.*
          find build -mindepth 2 -maxdepth 2 ! -name '.stamp_*' -exec rm -rf {} +
          du -sh . host target build images
      - name: Önbellek (Buildroot çıktısı) kaydet
        if: steps.cikti.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ankaros-output
          key: ${{ steps.anahtar.outputs.cikti }}

  release:
    name: Sürüm
    # Yalnızca iki mimari de derlenip açılış testini geçtiyse çalışır
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiket main'de mi
        # Daldaki denenmemiş bir commit'e konan etiket yayınlanmasın
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$TAG^{commit}" origin/main ||
            { echo "::error::$TAG main dalında değil"; exit 1; }
      - name: Sürüm notu
        # .github/surum-notu.md ardından CHANGELOG'daki "## [X.Y.Z]" bölümü. Bölüm yoksa sürüm
        # hazırlanmamıştır, durulur.
        run: |
          surum=${TAG#v}
          # İmajın os-release sürümü VERSION'dan gelir, etiketle aynı olmalı
          if [ "$(tr -d '[:space:]' < VERSION)" != "$surum" ]; then
            echo "::error::VERSION dosyası ($(cat VERSION)) etiketle ($surum) uyuşmuyor"
            exit 1
          fi
          awk -v baslik="## [$surum]" \
            'index($0, baslik) == 1 { bulundu = 1; next } bulundu && /^## \[/ { exit } bulundu' \
            CHANGELOG.md > degisiklikler.md
          if ! grep -q '[^[:space:]]' degisiklikler.md; then
            echo "::error::CHANGELOG.md'de [$surum] bölümü yok"
            exit 1
          fi
          sed -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" .github/surum-notu.md > notlar.md
          cat degisiklikler.md >> notlar.md
      - uses: actions/download-artifact@v4
        with:
          pattern: ankaros-qemu-*
          path: imajlar
      - name: Arşivler
        run: |
          for arch in aarch64 x86_64; do
            ad=ankaros-$TAG-$arch
            mv "imajlar/ankaros-qemu-$arch" "$ad"
            tar czf "$ad.tar.gz" "$ad"
          done
          sha256sum ankaros-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        # Koşu yeniden başlatılırsa var olan Release'in dosyaları ve notu değiştirilir
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notlar.md
            gh release upload "$TAG" ankaros-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" ankaros-*.tar.gz SHA256SUMS --verify-tag \
              --title "ankaros $TAG" --notes-file notlar.md
          fi
