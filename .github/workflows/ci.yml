# ankaros CI: kod stili denetimi, kabuğun derlenip qmllint'ten geçmesi, aarch64 imaj derlemesi ve
# imajın QEMU'da masaüstüne kadar açılması.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Kod stili
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.h' '*.hpp')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: shellcheck
        run: shellcheck scripts/*.sh external/board/*/*.sh

  shell:
    name: Kabuk ve compositor (Qt 6.9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ankaros imajındaki Qt sürümü (Buildroot 2026.02). Mac'te daha yeni bir Qt kullanılıyor,
      # kabuğun 6.9'da olmayan bir şey kullanması burada yakalanır.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          modules: qtwaylandcompositor
          cache: true
      - name: Kabuğu derle
        # Qt'nin WaylandCompositor paketi sistemdeki libwayland'e bağlı, aqt onu getirmiyor.
        run: |
          sudo apt-get install -y ninja-build libwayland-dev
          cmake -S shell -B build/shell -G Ninja -DANKAROS_SHELL_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build build/shell
      - name: Kabuk qmllint
        run: cmake --build build/shell --target all_qmllint
      - name: Kabuk modülünü kur
        # Compositor "import Ankaros.Shell" yapıyor, modül Qt'nin QML klasöründe olmalı.
        run: cmake --install build/shell
      - name: Compositor'ı derle
        run: |
          cmake -S compositor -B build/compositor -G Ninja
          cmake --build build/compositor
      - name: Compositor qmllint
        run: cmake --build build/compositor --target all_qmllint

  image:
    name: İmaj (aarch64)
    # Derleme makinemiz gibi arm64: Buildroot kendi araç zincirini yerel olarak derler.
    runs-on: ubuntu-24.04-arm
    # İlk derleme Qt 6 ve Mesa ile birlikte birkaç saat sürer, sonrakiler önbellekten hızlanır.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget cpio unzip rsync bc python3 libncurses-dev
      - name: Önbellek (kaynak paketleri ve ccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/ankaros-dl
            ~/.buildroot-ccache
          key: buildroot-${{ hashFiles('external/configs/*_defconfig', '.gitmodules') }}-${{ github.sha }}
          restore-keys: buildroot-${{ hashFiles('external/configs/*_defconfig', '.gitmodules') }}-
      - name: Derle
        run: ./scripts/build.sh
      - name: Açılış testi (QEMU)
        # İmaj ekransız açılır, masaüstü görünene kadar ekran görüntüsü alınır. Bu makinede KVM yok,
        # işlemci yazılımla taklit edilir: Mac'te 20 saniye süren açılış burada birkaç dakika sürebilir.
        run: |
          sudo apt-get install -y qemu-system-arm
          ./scripts/qemu-test.py --boot-timeout 600 --expect-desktop --wait 900 \
            --screenshot acilis-testi.png --log acilis-testi.log
      - name: Açılış testinin ekran görüntüsü ve günlüğü
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acilis-testi
          path: |
            acilis-testi.png
            acilis-testi.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ankaros-qemu-aarch64
          path: |
            ~/ankaros-output/images/Image
            ~/ankaros-output/images/rootfs.ext4
          retention-days: 14
