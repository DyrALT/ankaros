# ankaros CI: kod stili denetimi, kabuğun ve compositor'ın derlenip qmllint'ten geçmesi, sistem
# servislerinin derlenip birim testlerinden geçmesi. Birkaç dakika sürer, PR'ı birleştirmek için yeşil
# olması yeter. İmaj derlemesi ayrı iş akışında: imaj.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Kod stili
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.h' '*.hpp')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: shellcheck
        run: shellcheck scripts/*.sh external/board/*/*.sh

  shell:
    name: Kabuk ve compositor (Qt 6.9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ankaros imajındaki Qt sürümü (Buildroot 2026.02). Mac'te daha yeni bir Qt kullanılıyor,
      # kabuğun 6.9'da olmayan bir şey kullanması burada yakalanır.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          modules: qtwaylandcompositor
          cache: true
      - name: Kabuğu derle
        # Qt'nin WaylandCompositor paketi sistemdeki libwayland'e bağlı, aqt onu getirmiyor.
        run: |
          sudo apt-get install -y ninja-build libwayland-dev
          cmake -S shell -B build/shell -G Ninja -DANKAROS_SHELL_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build build/shell
      - name: Kabuk qmllint
        run: cmake --build build/shell --target all_qmllint
      - name: Kabuk modüllerini kur
        # Compositor Ankaros.Shell, Ankaros.UI ve Ankaros.System'i içe aktarıyor, modüller Qt'nin QML
        # klasöründe olmalı.
        run: cmake --install build/shell
      - name: Duman testi (önizleme, Qt 6.9)
        # Modüllerin imajdaki Qt sürümüyle gerçekten yüklendiğini denetler. qmllint, yalnızca çalışırken
        # ortaya çıkan hataları (ör. iki kez bulunan modül) yakalamaz. Önizleme bir QML hatasında 1 ile çıkar.
        run: |
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          mkdir -p duman-testi
          for args in "" "--launcher" "--login --error" "--lock"; do
            name=$(echo "masaustu $args" | tr -s ' -' '_')
            xvfb-run -a -s "-screen 0 1440x900x24" build/shell/preview/ankaros-shell-preview $args \
              --screenshot "duman-testi/$name.png"
          done
          for page in appearance wallpaper taskbar network user about; do
            xvfb-run -a build/shell/apps/settings/ankaros-settings --page $page \
              --screenshot "duman-testi/ayarlar_$page.png"
          done
      - name: Duman testinin ekran görüntüleri
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: duman-testi
          path: duman-testi
          if-no-files-found: ignore
          retention-days: 14
      - name: Compositor'ı derle
        run: |
          cmake -S compositor -B build/compositor -G Ninja
          cmake --build build/compositor
      - name: Compositor qmllint
        run: cmake --build build/compositor --target all_qmllint

  system:
    name: Sistem servisleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: |
          sudo apt-get install -y ninja-build
          cmake -S system -B build/system -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined"
          cmake --build build/system
      - name: Birim testleri
        run: ctest --test-dir build/system --output-on-failure
